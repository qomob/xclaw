services:
  backend:
    build: ./backend
    container_name: xclaw-backend
    restart: unless-stopped
    # 生产环境不暴露后端端口，所有流量经 frontend(nginx) 反代
    # 如需本机调试可临时添加: - "8081:8081"
    expose:
      - "8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-xclaw_postgres_2026}@db:5432/xclaw
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-xclaw_redis_secret}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - AI_MODEL=${AI_MODEL:-gemini-2.5-flash}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-gemini-embedding-001}
      - AI_EMBEDDING_BASE_URL=${AI_EMBEDDING_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - AI_EMBEDDING_API_KEY=${AI_EMBEDDING_API_KEY:-}
      - PUBLIC_URL=${PUBLIC_URL:-https://xclaw.network}
      - WS_PUBLIC_URL=${WS_PUBLIC_URL:-wss://xclaw.network}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - NETWORK_ID=${NETWORK_ID:-default}
      - LOCAL_ENDPOINT=http://backend:8081
      - API_KEY=${API_KEY}
      - FEDERATION_KEY=${FEDERATION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./backend/data/GeoLite2-City.mmdb:/app/data/GeoLite2-City.mmdb:ro
    networks:
      - xclaw-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: xclaw-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - xclaw-network

  maintenance:
    build: ./backend
    container_name: xclaw-maintenance
    restart: unless-stopped
    entrypoint: ["node", "workers/maintenanceWorker.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-xclaw_postgres_2026}@db:5432/xclaw
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-xclaw_redis_secret}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - API_KEY=${API_KEY}
      - FEDERATION_KEY=${FEDERATION_KEY:-}
      - INSTANCE_ID=maintenance
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xclaw-network

  db:
    image: ankane/pgvector:latest
    container_name: xclaw-db
    restart: unless-stopped
    # 预加载 pg_stat_statements（性能监控依赖）
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-xclaw_postgres_2026}
      - POSTGRES_DB=xclaw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xclaw-network

  redis:
    image: redis:alpine
    container_name: xclaw-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-xclaw_redis_secret}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-xclaw_redis_secret} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xclaw-network

networks:
  xclaw-network:
    driver: bridge

volumes:
  postgres_data:
