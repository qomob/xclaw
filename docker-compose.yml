services:
  backend:
    build: ./backend
    container_name: xclaw-backend
    restart: unless-stopped
    # 生产环境不暴露后端端口，所有流量经 frontend(nginx) 反代
    # 如需本机调试可临时添加: - "8081:8081"
    expose:
      - "8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/xclaw
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - AI_MODEL=${AI_MODEL:-gemini-2.5-flash}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-gemini-embedding-001}
      - AI_EMBEDDING_BASE_URL=${AI_EMBEDDING_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - AI_EMBEDDING_API_KEY=${AI_EMBEDDING_API_KEY:-}
      - PUBLIC_URL=${PUBLIC_URL:-https://xclaw.network}
      - WS_PUBLIC_URL=${WS_PUBLIC_URL:-wss://xclaw.network}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - NETWORK_ID=${NETWORK_ID:-default}
      - LOCAL_ENDPOINT=http://backend:8081
      - API_KEY=${API_KEY}
      # 管理密钥/监控令牌必须显式透传,后端按 fail-closed 处理(缺失即禁用对应能力)
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - MONITOR_TOKEN=${MONITOR_TOKEN:-}
      - FEDERATION_KEY=${FEDERATION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    volumes:
      - ./backend/data:/app/data:ro
      # 生成的密钥（ENCRYPTION_KEY/JWT_SECRET）持久化，容器重建不丢失
      - backend_keys:/data
      # 日志持久化：容器重建不丢失，运维可挂载/采集 /app/logs
      - backend_logs:/app/logs
      # 技能强沙箱需要 Docker socket（宿主级权限！）。默认不挂载——
      # 仅在专用沙箱机部署且接受风险时取消下行注释。见 docs/skill-sandbox.md
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - xclaw-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: xclaw-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - xclaw-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  maintenance:
    build: ./backend
    container_name: xclaw-maintenance
    restart: unless-stopped
    entrypoint: ["node", "workers/maintenanceWorker.js"]
    # 覆盖 backend 镜像继承的 HEALTHCHECK（maintenance 不提供 HTTP 服务）
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/xclaw
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - API_KEY=${API_KEY}
      - FEDERATION_KEY=${FEDERATION_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - INSTANCE_ID=maintenance
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - xclaw-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # 加密数据库备份（可选服务，显式启用：docker compose --profile backup up -d）
  # 需要 BACKUP_ENCRYPTION_KEY；建议同时配置 BACKUP_UPLOAD_CMD 做异地副本
  db-backup:
    build: ./backend
    container_name: xclaw-db-backup
    restart: unless-stopped
    profiles: ["backup"]
    entrypoint: ["./scripts/backup-loop.sh"]
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/xclaw
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY must be set for backup service}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_UPLOAD_CMD=${BACKUP_UPLOAD_CMD:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 备份脚本以脚本位置推算项目根，容器内落盘 /database/backups
      - backup_data:/database/backups
    networks:
      - xclaw-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # 官方命名空间(ankane/ 已归档);存量 PG15 数据卷需在 override 中钉 pg15
    image: pgvector/pgvector:pg16
    container_name: xclaw-db
    restart: unless-stopped
    # 预加载 pg_stat_statements（性能监控依赖）
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=xclaw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xclaw-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:alpine
    container_name: xclaw-redis
    restart: unless-stopped
    # AOF 持久化：Agent API Key / 在线状态 / 任务队列等均存于 Redis，
    # 重启不丢凭据（默认无持久化，容器重建将丢失全部 Agent 密钥）
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xclaw-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  xclaw-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  backend_keys:
  backup_data:
