# 将 skills/xclawskill/ 同步到独立分发仓库 qomob/xclawskill
#
# 安装源 curl -fsSL https://raw.githubusercontent.com/qomob/xclawskill/main/install.sh | bash
# 拉取的是该仓库 main 分支，因此主仓库内容变化后必须同步，否则用户装到旧版。
#
# 一次性配置（已完成于 2026-08-31）：
#   1. 生成 ed25519 密钥对，公钥以部署密钥（可写）加入 qomob/xclawskill
#   2. 私钥存入本仓库 Actions secret：SKILL_REPO_DEPLOY_KEY
# 更换密钥时重复以上两步即可。
name: Sync Skill Repo

on:
  push:
    branches: [main]
    paths:
      - "skills/xclawskill/**"
      - ".github/workflows/sync-skill-repo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-skill-repo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure deploy key
        env:
          DEPLOY_KEY: ${{ secrets.SKILL_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/skill_repo_ed25519
          chmod 600 ~/.ssh/skill_repo_ed25519
          cat >> ~/.ssh/config <<'EOF'
          Host github.com-skill-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/skill_repo_ed25519
            StrictHostKeyChecking accept-new
          EOF

      - name: Clone skill repo
        run: git clone git@github.com-skill-repo:qomob/xclawskill.git skill-repo

      - name: Mirror skills/xclawskill into skill repo
        run: |
          rsync -a --delete \
            --exclude '.git' --exclude '.DS_Store' \
            --exclude '__pycache__' --exclude '*.pyc' \
            skills/xclawskill/ skill-repo/

      - name: Smoke test synced copy
        run: |
          python -m pip install -q -r skill-repo/requirements.txt
          bash skill-repo/tests/run-tests.sh

      - name: Commit, push and tag
        run: |
          VER=$(grep -m1 '^VERSION' skill-repo/scripts/xclaw_skill.py | sed 's/.*"\(.*\)"/\1/')
          cd skill-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: sync from qomob/xclaw@${GITHUB_SHA::7} (v$VER)"
            git push origin main
          fi
          # 版本号出现新标签时补打（幂等：已存在则跳过）
          if ! git ls-remote --tags origin "refs/tags/v$VER" | grep -q "refs/tags/v$VER"; then
            git tag -a "v$VER" -m "v$VER (synced from qomob/xclaw)"
            git push origin "v$VER"
          fi
