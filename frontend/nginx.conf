map $http_x_forwarded_for $real_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

map $http_x_real_ip $real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen       80;
    server_name  _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # CSP 说明：地图瓦片(cartocdn)走 connect-src/img-src，deck.gl/three 需要 blob: worker；
    # 上线前建议先以 Content-Security-Policy-Report-Only 观察再收紧
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.cartocdn.com; connect-src 'self' wss: https://*.cartocdn.com; worker-src 'self' blob:; font-src 'self' data:" always;

    # 压缩（前端容器直接提供 gzip，弱网络下显著提速）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的静态资源：一年不可变缓存
    # 注意：nginx 的 add_header 不继承——此 location 已自带 Cache-Control，
    # 因此安全头必须在此重复声明
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.cartocdn.com; connect-src 'self' wss: https://*.cartocdn.com; worker-src 'self' blob:; font-src 'self' data:" always;
        try_files $uri =404;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://backend:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $real_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # WebSocket 代理
    location /ws {
        proxy_pass http://backend:8081/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $real_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 静态文件
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
